name: Release DB

# Applique les migrations Prisma sur la BASE DE PRODUCTION — Scalingo HDS
# depuis le cutover du 2026-08-22. La base n'est pas exposée à Internet :
# ce workflow ne s'y connecte JAMAIS directement, et AUCUNE URL de base ne
# transite par GitHub (leçon de l'incident du 2026-08-22 : un secret d'URL
# jamais repointé a fait migrer la mauvaise base). Il exécute
# `web/scripts/release-db-scalingo.sh` (préflights lecture seule +
# `migrate deploy`) EN ONE-OFF dans l'image de production, via le CLI
# Scalingo (secret `SCALINGO_API_TOKEN`). Le `postdeploy` de l'app ne migre
# plus (`WN_MIGRATIONS_PAR_RELEASE_DB=1`, constaté par une garde) :
# l'approbation humaine de ce workflow est l'UNIQUE porte d'écriture du
# schéma. PROPOSÉ AUTOMATIQUEMENT dès qu'une migration atterrit sur `main`,
# gaté par l'environnement protégé `release-db` (required reviewers) :
# l'automatisation porte sur le DÉCLENCHEMENT, jamais sur l'APPROBATION.
# Le mode `import-cb` est HORS SERVICE depuis le cutover (il visait
# Supabase) — refus explicite plus bas. Runbook et séquence de mise en
# service : docs/DEPLOIEMENT_RELEASE_DB.md · historique et raisonnements :
# docs/adr/2026-08-07-commentaires-workflows.md · décision : D-086.

on:
  # DÉCLENCHEMENT AUTOMATIQUE — proposer la release, jamais l'approuver : le job
  # porte `environment: release-db`, ses required reviewers mettent le run en
  # `waiting`. Sur un événement `push`, `inputs` est vide → un déclenchement
  # automatique EST un `migrate-only` ; le mode `import-cb` exige EN PLUS
  # `github.event_name == 'workflow_dispatch'` — et il est refusé (hors
  # service) tant qu'il n'est pas réécrit pour Scalingo.
  # Le filtre `paths` voit DEUX chemins, et deux seulement :
  # `web/prisma/migrations/**`, seul chemin légitime d'une migration (doctrine
  # « registre canonique »), et `web/src/lib/clinical/**` depuis D-044, pour que
  # les contrats de lecture soient rejoués sur la production quand une table de
  # règles signée change. Détail :
  # docs/adr/2026-08-07-commentaires-workflows.md.
  push:
    branches: [main]
    paths:
      - 'web/prisma/migrations/**'
      # D-044 — un push clinique PROPOSE une release, ne l'approuve jamais ;
      # sur un push, la portée est `migrate-only`. Récit : l'ADR ci-dessus.
      - 'web/src/lib/clinical/**'

  workflow_dispatch:
    inputs:
      mode:
        description: "Portée de la release (import-cb : hors service depuis le cutover, refus explicite)"
        required: true
        type: choice
        options:
          - migrate-only
          - import-cb

# Le checkout est le seul besoin : aucun job n'écrit sur GitHub.
permissions:
  contents: read

# Jamais deux releases concurrentes sur la même base de production : la seconde
# attend la première au lieu de s'entrelacer avec elle.
concurrency:
  group: release-db-production
  cancel-in-progress: false

jobs:
  # CE QUE L'APPROBATEUR APPROUVE, écrit avant qu'on le lui demande. Ce job ne
  # porte PAS d'`environment:` : il tourne AVANT le gate et `release` en dépend
  # — le résumé est déjà dans l'onglet Summary quand la demande d'approbation
  # s'affiche. Sans secret, il ne lit pas la base : il dit ce que ce push
  # APPORTE, pas ce que `migrate deploy` appliquera. PAS de `continue-on-error`,
  # arbitrage assumé : un résumé cassé bloque la release plutôt que de faire
  # approuver à l'aveugle.
  resume:
    runs-on: ubuntu-latest
    # Même condition que `release`. Sans elle, un dispatch hors `main` produirait
    # un résumé engageant — « voici ce qui est proposé » — pendant que
    # `ref-refusee` refuse la ref. Deux messages contradictoires sur la même page.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # `github.event.before` n'est atteignable qu'avec l'historique ; le
          # défaut (profondeur 1) ferait échouer le diff sur tout push de plus
          # d'un commit.
          fetch-depth: 0

      - name: "Résumé pour l'approbateur"
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
          EVENEMENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "## Release DB — ce qui est proposé"
            echo
            if [ "$EVENEMENT" = "push" ]; then
              echo "Déclenchement **automatique** : une migration OU une table de règles"
              echo "cliniques (\`web/src/lib/clinical/**\`, [[D-044]]) est arrivée sur \`main\`."
              echo "Un push clinique SANS migration déclenche aussi cette proposition : le"
              echo "préflight de fraîcheur des claims n'a de sens que contre la production."
              echo "Portée : \`migrate-only\` (l'import NABM reste manuel)."
              echo
              echo "### Migrations apportées par ce push"
              echo
              echo "> ⚠️ **Cette liste n'est PAS la liste de ce qui sera appliqué.**"
              echo "> \`migrate deploy\` applique TOUTES les migrations en attente dans"
              echo "> \`_prisma_migrations\`, y compris celles d'un push antérieur dont la"
              echo "> release n'a jamais été approuvée. Ce résumé dit ce que ce push"
              echo "> AJOUTE, pas ce qui partira. La liste réelle est celle que"
              echo "> \`migrate deploy\` imprime — après l'approbation."
              echo
              # Un `before` de zéros (première poussée) ou un commit devenu
              # inatteignable après réécriture : se rabattre sur le commit de tête
              # plutôt que de faire échouer le résumé.
              if [ -n "$AVANT" ] && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
                PLAGE="$AVANT..$APRES"
              else
                echo "> \`before\` inatteignable — seul le commit de tête est inspecté."
                echo
                PLAGE="$APRES^..$APRES"
              fi
              # `--diff-filter=d` écarte les SUPPRESSIONS : le revert d'une migration
              # se lirait sinon « migration apportée », et l'approbation qui suivrait
              # ferait échouer `migrate deploy` sur la dérive. `grep -v` écarte
              # `migration_lock.toml`, qui vit à la racine du dossier et remonterait
              # comme s'il était une migration.
              # Le `if` capture le statut de `git diff` SEUL, et c'est le point :
              # dans un pipeline, sans `pipefail`, le statut rendu est celui de la
              # DERNIÈRE commande — ici `sort`, qui réussit toujours. Un `git diff`
              # en échec passerait donc pour « aucune migration ». Isolé, il
              # distingue « rien à signaler » de « on ne sait pas ».
              #
              # Le `|| true` du filtrage, lui, ne sert à rien aujourd'hui : `grep -v`
              # rend bien 1 quand il ne reste aucune ligne (push ne touchant que
              # `migration_lock.toml`), mais `sort` termine le pipeline et avale ce
              # statut. Il est là pour le jour où quelqu'un ajoutera
              # `set -o pipefail` : sans lui, ce jour-là, un push sans rien à
              # signaler bloquerait une release.
              if BRUT=$(git diff --name-only --diff-filter=d "$PLAGE" -- web/prisma/migrations/); then
                TROUVEES=$(printf '%s\n' "$BRUT" \
                  | sed 's|web/prisma/migrations/||;s|/.*||' \
                  | grep -v -e '^$' -e '^migration_lock\.toml$' \
                  | sort -u || true)
                if [ -n "$TROUVEES" ]; then
                  echo "$TROUVEES" | sed 's/^/- `/;s/$/`/'
                else
                  echo "_Aucune migration ajoutée par ce push — push clinique seul"
                  echo "([[D-044]]), suppression seule, ou \`migration_lock.toml\` seul. Rien"
                  echo "de neuf à appliquer de ce fait ; un reliquat antérieur peut"
                  echo "néanmoins partir (voir l'avertissement)._"
                fi
              else
                # Distinct du cas « aucune migration » : là, on ne SAIT pas.
                echo "**Le diff a échoué** — impossible de dire ce que ce push apporte."
                echo "Ne pas approuver sans avoir regardé le contenu du push à la main."
              fi
            else
              echo "Déclenchement **manuel** (\`workflow_dispatch\`), mode : \`${MODE:-non précisé}\`."
            fi
            echo
            echo "### Avant d'approuver"
            echo
            echo "- Cible : app Scalingo \`wellneuro\` (région \`osc-fr1\`), base PostgreSQL"
            echo "  de l'add-on — aucune URL de base ne transite par GitHub."
            echo "- Ces migrations sont-elles passées par une PR relue et mergée ? Ce workflow"
            echo "  ne part que de \`main\`, mais il n'a aucun moyen de le vérifier lui-même."
            echo "- Modèle Scalingo (depuis le 2026-08-22) : le CODE se déploie d'abord,"
            echo "  automatiquement ; la migration part APRÈS cette approbation, en one-off"
            echo "  dans l'image déployée. Un DROP rend le retour arrière dépendant d'une"
            echo "  restauration de base ; un ADD exige que le code qui le lit soit derrière"
            echo "  un drapeau éteint — voir \`docs/DEPLOIEMENT_RELEASE_DB.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # N'écrire que ce qui est passé par une PR relue et mergée. Le `if:` ci-dessous
  # est évalué AVANT les règles de l'environnement : il ne consomme aucune
  # approbation. `ref-refusee` est son pendant BRUYANT (un job non éligible est
  # *skipped*, muet). Troisième clé : la restriction de branche de
  # l'environnement, côté plateforme. Récit : docs/adr/2026-08-07-commentaires-workflows.md.
  release:
    runs-on: ubuntu-latest
    needs: resume
    if: github.ref == 'refs/heads/main'
    # L'environnement protégé porte les required reviewers et le jeton d'API.
    environment: release-db
    # Les trois boucles d'attente (déploiement 20 min, sentinelle 10 min,
    # contre-épreuve 5 min) tiennent dans cette borne ; au-delà, l'état est
    # INCONNU et se vérifie à la main — jamais de relance à l'aveugle.
    timeout-minutes: 45
    env:
      SCALINGO_APP: wellneuro
      SCALINGO_REGION: osc-fr1
      # Lie les sentinelles des one-offs à CE run : un WN_RELEASE_DB_OK laissé
      # dans la fenêtre de logs par un one-off antérieur ne peut pas passer
      # pour le succès du run courant.
      WN_RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # Le jeton `SCALINGO_API_TOKEN`, lui, n'est PAS en portée de job : c'est
      # une créance PLEINE sur l'app (one-offs, environnement, tunnels) — il
      # n'est visible que des seules étapes qui parlent à Scalingo, jamais de
      # l'installation du CLI.
    steps:
      # Le mode import-cb visait la base Supabase (advisors + import NABM) :
      # HORS SERVICE depuis le cutover du 2026-08-22 — refus explicite plutôt
      # qu'une écriture silencieuse sur l'ancienne base. Sa réécriture pour
      # Scalingo est une décision distincte (D-081 : la pose de
      # WN_CB_RESULTS_ENABLED accompagnera le code de la Phase C).
      - name: "Garde — import-cb hors service depuis le cutover (fail-closed)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'import-cb' }}
        run: |
          echo "❌ Le mode import-cb visait Supabase, décommissionnée par la bascule" >&2
          echo "   Scalingo du 2026-08-22 (D-080). Il sera réécrit avec la Phase C." >&2
          exit 1

      - name: "Garde — SCALINGO_API_TOKEN requis (fail-closed)"
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: |
          if [ -z "${SCALINGO_API_TOKEN:-}" ]; then
            echo "❌ SCALINGO_API_TOKEN absent des secrets de l'environnement 'release-db'." >&2
            echo "   Release refusée : aucune écriture ne doit partir sans cible explicite." >&2
            exit 1
          fi

      # Nécessaire à l'empreinte des migrations (plus bas) : le contenu du
      # COMMIT APPROUVÉ, pas celui d'une image.
      - uses: actions/checkout@v4

      # Version épinglée + empreinte sha256 relevée à la main le 2026-08-22 :
      # le chemin d'écriture de la production ne dépend pas du contenu courant
      # d'un domaine de téléchargement. Mise à jour = nouveau couple
      # version/empreinte, en PR. Le jeton n'est PAS en portée ici.
      - name: "CLI Scalingo 1.48.0 (épinglé, empreinte vérifiée)"
        run: |
          curl -fsSL -o scalingo-cli.tgz \
            https://github.com/Scalingo/cli/releases/download/1.48.0/scalingo_1.48.0_linux_amd64.tar.gz
          echo "4575a9a960d724d5a4b1edcaef5486cc081080d87e62291c2e0f2cdf21f5ddd1  scalingo-cli.tgz" | sha256sum -c -
          tar -xzf scalingo-cli.tgz
          sudo install scalingo_1.48.0_linux_amd64/scalingo /usr/local/bin/scalingo
          scalingo --version

      # La propriété « le postdeploy ne migre plus » tient à UNE variable
      # d'app : la constater plutôt que la croire. `env-get` d'un drapeau non
      # secret — jamais `env`, qui déverserait la configuration entière de
      # l'app (secrets compris) dans le log CI.
      - name: "Garde — le postdeploy ne migre plus (drapeau constaté)"
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: |
          DRAPEAU=$(scalingo --app "$SCALINGO_APP" --region "$SCALINGO_REGION" \
            env-get WN_MIGRATIONS_PAR_RELEASE_DB 2>/dev/null || true)
          if [ "$DRAPEAU" != "1" ]; then
            echo "❌ WN_MIGRATIONS_PAR_RELEASE_DB ≠ 1 sur l'app : le postdeploy migre" >&2
            echo "   encore de son côté — ce workflow ne serait pas l'unique porte." >&2
            echo "   Poser le drapeau (séquence de mise en service," >&2
            echo "   docs/DEPLOIEMENT_RELEASE_DB.md) puis relancer." >&2
            exit 1
          fi
          echo "✓ Drapeau constaté : le postdeploy ne migre plus."

      # L'approbation autorise le COMMIT APPROUVÉ ; le one-off tourne dans
      # l'image du DERNIER déploiement réussi. Double exigence, sur la sortie
      # réelle du CLI (SHA complets, du plus récent au plus ancien, constaté
      # le 2026-08-22) : le commit approuvé doit être déployé, ET être le
      # déploiement réussi LE PLUS RÉCENT — si un commit plus neuf est arrivé
      # pendant l'attente d'approbation, l'image contiendrait des changements
      # que personne n'a approuvés. L'empreinte des migrations (étape
      # suivante) re-vérifie la même propriété DANS le conteneur, au moment
      # d'écrire.
      - name: "Garde — le commit approuvé est le dernier déployé"
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            SUCCES=$(scalingo --app "$SCALINGO_APP" --region "$SCALINGO_REGION" deployments 2>/dev/null \
              | grep 'success' | grep -oE '\b[0-9a-f]{40}\b' || true)
            DERNIER=$(printf '%s\n' "$SUCCES" | head -1)
            if [ "$DERNIER" = "$GITHUB_SHA" ]; then
              echo "✓ $GITHUB_SHA est le dernier déploiement réussi."
              exit 0
            fi
            if printf '%s\n' "$SUCCES" | grep -qx "$GITHUB_SHA"; then
              echo "❌ $GITHUB_SHA est déployé, mais un déploiement PLUS RÉCENT existe" >&2
              echo "   ($DERNIER) : l'image ne correspond plus au commit approuvé." >&2
              echo "   Relancer release-db depuis le commit de tête de main." >&2
              exit 1
            fi
            echo "… déploiement de $GITHUB_SHA pas encore réussi ($i/40), attente 30 s."
            sleep 30
          done
          echo "❌ $GITHUB_SHA jamais déployé en success après 20 min — release refusée." >&2
          exit 1

      # Le protocole de sortie est porté par les sentinelles du script
      # embarqué (web/scripts/release-db-scalingo.sh), LIÉES AU RUN (`id=`) :
      # toute fin sans sentinelle (timeout, conteneur tué) est un échec —
      # fail-closed. L'empreinte des migrations du commit approuvé part avec
      # le one-off : le script refuse d'écrire si l'image n'embarque pas
      # exactement ces migrations-là. NB : annuler ce job n'arrête PAS un
      # one-off déjà lancé (`scalingo one-off-stop <conteneur>` le fait) —
      # un run annulé se vérifie à la main, comme un run muet.
      - name: "Release en one-off (préflights + migrate deploy)"
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: |
          EMPREINTE=$(ls -1 web/prisma/migrations | LC_ALL=C sort | sha256sum | cut -d' ' -f1)
          echo "→ Empreinte des migrations approuvées : $EMPREINTE"
          SORTIE=$(scalingo --app "$SCALINGO_APP" --region "$SCALINGO_REGION" \
            run --detached \
            -e WN_RELEASE_ID="$WN_RELEASE_ID" \
            -e WN_MIGRATIONS_EMPREINTE="$EMPREINTE" \
            "bash scripts/release-db-scalingo.sh" 2>&1)
          echo "$SORTIE"
          ONEOFF=$(echo "$SORTIE" | grep -oE 'one-off-[0-9]+' | head -1)
          if [ -z "$ONEOFF" ]; then
            echo "❌ Impossible d'identifier le conteneur one-off." >&2
            exit 1
          fi
          echo "→ Suivi de $ONEOFF…"
          for i in $(seq 1 60); do
            LOGS=$(scalingo --app "$SCALINGO_APP" --region "$SCALINGO_REGION" \
              logs --filter "$ONEOFF" -n 300 2>/dev/null || true)
            if echo "$LOGS" | grep -q "WN_RELEASE_DB_OK id=$WN_RELEASE_ID"; then
              echo "$LOGS"
              echo "✓ Release appliquée."
              exit 0
            fi
            if echo "$LOGS" | grep -q "WN_RELEASE_DB_ECHEC id=$WN_RELEASE_ID"; then
              echo "$LOGS"
              echo "❌ La release a échoué dans le one-off (voir l'étape en échec ci-dessus)." >&2
              exit 1
            fi
            sleep 10
          done
          echo "❌ Aucune sentinelle après 10 min — état INCONNU, à vérifier à la main" >&2
          echo "   (scalingo logs --filter $ONEOFF), ne pas relancer à l'aveugle." >&2
          exit 1

      # Contre-épreuve par un second one-off NEUF, qui n'exporte rien : la
      # résolution d'URL est celle de l'image (web/prisma.config.ts →
      # add-on), pas celle du script de release. Sentinelles liées au run,
      # comme la release — le texte de `migrate status`, lui, ne peut pas
      # porter d'id.
      - name: "Vérification — migrate status sur conteneur"
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: |
          SORTIE=$(scalingo --app "$SCALINGO_APP" --region "$SCALINGO_REGION" \
            run --detached -e WN_RELEASE_ID="$WN_RELEASE_ID" \
            "bash scripts/release-db-statut.sh" 2>&1)
          ONEOFF=$(echo "$SORTIE" | grep -oE 'one-off-[0-9]+' | head -1)
          [ -n "$ONEOFF" ] || { echo "❌ one-off de vérification introuvable." >&2; exit 1; }
          echo "→ Suivi de $ONEOFF…"
          for i in $(seq 1 30); do
            LOGS=$(scalingo --app "$SCALINGO_APP" --region "$SCALINGO_REGION" \
              logs --filter "$ONEOFF" -n 100 2>/dev/null || true)
            if echo "$LOGS" | grep -q "WN_STATUT_DB_OK id=$WN_RELEASE_ID"; then
              echo "✓ Schéma à jour, constaté depuis la base."
              exit 0
            fi
            if echo "$LOGS" | grep -q "WN_STATUT_DB_ECHEC id=$WN_RELEASE_ID"; then
              echo "$LOGS" | tail -30
              echo "❌ La base n'est PAS à jour après la release — vérifier à la main." >&2
              exit 1
            fi
            sleep 10
          done
          echo "❌ Aucune sentinelle de statut après 5 min — vérifier à la main." >&2
          exit 1

  # Le pendant bruyant du `if:` porté par `release` : sans lui, un dispatch hors
  # `main` se terminerait en *skipped*, sans un mot, et se lirait comme « la base
  # était déjà à jour ». Pas d'`environment:` ici — aucun reviewer n'est sollicité
  # pour apprendre qu'on s'est trompé de branche.
  ref-refusee:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: "Garde — release refusée hors de main (fail-closed)"
        env:
          # Par env, jamais interpolé dans le `run:` — une ref est une entrée
          # contrôlée par l'appelant.
          REF: ${{ github.ref }}
        run: |
          echo "❌ release-db refuse la ref « $REF »." >&2
          echo "   La base de production ne s'écrit qu'avec du SQL relu en PR et" >&2
          echo "   mergé sur main. Relancer depuis main :" >&2
          echo "     gh workflow run release-db.yml --ref main -f mode=migrate-only" >&2
          exit 1
