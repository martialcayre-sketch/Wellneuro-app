name: Release DB

# Applique les migrations Prisma et l'import de nomenclature NABM (CB-02a) sur la
# BASE DE PRODUCTION, HORS du build applicatif Vercel. PROPOSÉ AUTOMATIQUEMENT dès
# qu'une migration atterrit sur `main`, déclenchable à la main pour l'import NABM,
# et dans les deux cas gaté par l'environnement protégé `release-db` (required
# reviewers) : c'est un SECOND gate humain, en plus de la revue de PR qui a mergé
# la migration. L'automatisation porte sur le DÉCLENCHEMENT, jamais sur
# l'APPROBATION. L'environnement
# porte un nom DÉDIÉ : `Production` existe déjà et appartient à l'intégration
# Vercel (les noms d'environnement GitHub sont insensibles à la casse) — y attacher
# des required reviewers gaterait les déploiements Vercel.
#
# POURQUOI CE WORKFLOW. Historiquement, web/scripts/vercel-build.sh appliquait les
# migrations et les imports AU BUILD. Deux défauts en découlaient : un build
# pouvait réussir en laissant la base « en retard » (MIGRATE_DATABASE_URL absente
# → avertissement, pas échec) ; et le contrat post-import s'exécutait après le
# COMMIT (« build rouge » ne voulait pas dire « rien écrit »). Ce workflow sort
# l'écriture du build : le build redevient un pur `next build` sans effet de bord.
#
# `migrate deploy` n'invente jamais de SQL : il applique uniquement les migrations
# committées (relues en PR). Le gate humain reste la revue de PR, doublée ici de
# l'approbation d'environnement.
#
# PÉRIMÈTRE. Deux modes seulement : `migrate-only` et `import-cb`. L'import C5
# CIQUAL n'est VOLONTAIREMENT PAS câblé ici — voir docs/DEPLOIEMENT_RELEASE_DB.md :
# son garde repose sur `VERCEL_ENV=production`, qui ne tient pas hors Vercel ; le
# brancher exigerait de le refaire à la manière du garde `--base` de NABM. C5 est
# par ailleurs déjà importé (append-only, idempotent) et re-semé par dump côté
# Scalingo (web/scripts/db-deploy.sh), donc sans besoin d'un chemin d'exécution.
#
# Runbook de déclenchement et étapes ops (secrets, environnement) :
# docs/DEPLOIEMENT_RELEASE_DB.md.

on:
  # DÉCLENCHEMENT AUTOMATIQUE — proposer la release, jamais l'approuver.
  #
  # Une migration qui atterrit sur `main` crée le run toute seule. Le gate humain
  # n'est PAS contourné pour autant : le job porte `environment: release-db`, dont
  # les required reviewers mettent le run en `waiting` au lieu de l'exécuter. Ce
  # qui change n'est pas qui décide, c'est qui doit y penser — auparavant,
  # personne ne le rappelait, et « rien ne détecte une release oubliée » était une
  # question ouverte laissée par le lot qui a créé ce workflow.
  #
  # Le mode n'a pas à être dérivé : sur un événement `push`, le contexte `inputs`
  # est vide, donc `inputs.mode == 'import-cb'` ne peut pas être vrai. Un
  # déclenchement automatique EST un `migrate-only`.
  #
  # Ce raisonnement seul aurait suffi, et il n'est pas seul — même motif « deux
  # clés » que le reste du fichier. Les trois étapes d'import portent AUSSI
  # `github.event_name == 'workflow_dispatch'`, parce que la première clé repose
  # sur une sémantique de plateforme (« `inputs` est vide hors dispatch ») que ce
  # dépôt ne vérifie nulle part : aucun lint de workflow ne tourne en CI, et une
  # erreur d'expression ici ne se révélerait qu'à l'exécution — c'est-à-dire avec
  # une migration en attente. La seule chose qui ne doit JAMAIS partir toute seule
  # est l'import NABM ; il ne dépend donc pas d'un raisonnement, même juste.
  #
  # Le filtre `paths` ne voit que les migrations : un push qui ne touche pas
  # `web/prisma/migrations/**` ne crée aucun run, donc aucune approbation à donner
  # pour rien. Corollaire à connaître : une migration introduite AUTREMENT que par
  # un fichier de ce dossier n'est pas vue — il n'y en a pas d'autre chemin
  # légitime, c'est précisément la doctrine « registre canonique ».
  push:
    branches: [main]
    paths:
      - 'web/prisma/migrations/**'

  workflow_dispatch:
    inputs:
      mode:
        description: "Portée de la release"
        required: true
        type: choice
        options:
          - migrate-only
          - import-cb
      nabm_base:
        description: "import-cb uniquement : hôte attendu de MIGRATE_DATABASE_URL (garde « deux clés »). Laisser vide sinon."
        required: false
        type: string

# Jamais deux releases concurrentes sur la même base de production : la seconde
# attend la première au lieu de s'entrelacer avec elle.
concurrency:
  group: release-db-production
  cancel-in-progress: false

jobs:
  # CE QUE L'APPROBATEUR APPROUVE, écrit avant qu'on le lui demande.
  #
  # Ce job n'a PAS d'`environment:`, et c'est tout son intérêt : il tourne donc
  # AVANT le gate, et `release` en dépend, si bien que le résumé est déjà dans
  # l'onglet Summary au moment où la demande d'approbation s'affiche. Le mettre
  # dans le job gaté l'aurait rendu lisible seulement après l'approbation — c'est
  # -à-dire trop tard pour éclairer la décision qu'il documente.
  #
  # Il ne lit PAS la base : sans secret, il ne peut pas dire ce qui est réellement
  # en attente côté `_prisma_migrations`, seulement ce que ce push apporte. La
  # liste des migrations effectivement appliquées reste celle que `migrate deploy`
  # imprime dans le job suivant, et la vérification d'après-coup se fait en base.
  #
  # PAS de `continue-on-error`, et c'est un arbitrage : si le résumé ne peut pas
  # être produit, `release` ne part pas. Un résumé cassé bloque donc une migration
  # — le prix assumé pour ne jamais demander d'approuver à l'aveugle, ce qui est
  # exactement le défaut que ce job existe pour fermer.
  resume:
    runs-on: ubuntu-latest
    # Même condition que `release`. Sans elle, un dispatch hors `main` produirait
    # un résumé engageant — « voici ce qui est proposé » — pendant que
    # `ref-refusee` refuse la ref. Deux messages contradictoires sur la même page.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # `github.event.before` n'est atteignable qu'avec l'historique ; le
          # défaut (profondeur 1) ferait échouer le diff sur tout push de plus
          # d'un commit.
          fetch-depth: 0

      - name: "Résumé pour l'approbateur"
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
          EVENEMENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "## Release DB — ce qui est proposé"
            echo
            if [ "$EVENEMENT" = "push" ]; then
              echo "Déclenchement **automatique** : une migration est arrivée sur \`main\`."
              echo "Portée : \`migrate-only\` (l'import NABM reste manuel)."
              echo
              echo "### Migrations apportées par ce push"
              echo
              echo "> ⚠️ **Cette liste n'est PAS la liste de ce qui sera appliqué.**"
              echo "> \`migrate deploy\` applique TOUTES les migrations en attente dans"
              echo "> \`_prisma_migrations\`, y compris celles d'un push antérieur dont la"
              echo "> release n'a jamais été approuvée. Ce résumé dit ce que ce push"
              echo "> AJOUTE, pas ce qui partira. La liste réelle est celle que"
              echo "> \`migrate deploy\` imprime — après l'approbation."
              echo
              # Un `before` de zéros (première poussée) ou un commit devenu
              # inatteignable après réécriture : se rabattre sur le commit de tête
              # plutôt que de faire échouer le résumé.
              if [ -n "$AVANT" ] && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
                PLAGE="$AVANT..$APRES"
              else
                echo "> \`before\` inatteignable — seul le commit de tête est inspecté."
                echo
                PLAGE="$APRES^..$APRES"
              fi
              # `--diff-filter=d` écarte les SUPPRESSIONS : le revert d'une migration
              # se lirait sinon « migration apportée », et l'approbation qui suivrait
              # ferait échouer `migrate deploy` sur la dérive. `grep -v` écarte
              # `migration_lock.toml`, qui vit à la racine du dossier et remonterait
              # comme s'il était une migration.
              # Le `if` capture le statut de `git diff` SEUL, et c'est le point :
              # dans un pipeline, sans `pipefail`, le statut rendu est celui de la
              # DERNIÈRE commande — ici `sort`, qui réussit toujours. Un `git diff`
              # en échec passerait donc pour « aucune migration ». Isolé, il
              # distingue « rien à signaler » de « on ne sait pas ».
              #
              # Le `|| true` du filtrage, lui, ne sert à rien aujourd'hui : `grep -v`
              # rend bien 1 quand il ne reste aucune ligne (push ne touchant que
              # `migration_lock.toml`), mais `sort` termine le pipeline et avale ce
              # statut. Il est là pour le jour où quelqu'un ajoutera
              # `set -o pipefail` : sans lui, ce jour-là, un push sans rien à
              # signaler bloquerait une release.
              if BRUT=$(git diff --name-only --diff-filter=d "$PLAGE" -- web/prisma/migrations/); then
                TROUVEES=$(printf '%s\n' "$BRUT" \
                  | sed 's|web/prisma/migrations/||;s|/.*||' \
                  | grep -v -e '^$' -e '^migration_lock\.toml$' \
                  | sort -u || true)
                if [ -n "$TROUVEES" ]; then
                  echo "$TROUVEES" | sed 's/^/- `/;s/$/`/'
                else
                  echo "_Aucune migration ajoutée par ce push — suppression seule, ou"
                  echo "\`migration_lock.toml\` seul. Rien de neuf à appliquer de ce fait ;"
                  echo "un reliquat antérieur peut néanmoins partir (voir l'avertissement)._"
                fi
              else
                # Distinct du cas « aucune migration » : là, on ne SAIT pas.
                echo "**Le diff a échoué** — impossible de dire ce que ce push apporte."
                echo "Ne pas approuver sans avoir regardé le contenu du push à la main."
              fi
            else
              echo "Déclenchement **manuel** (\`workflow_dispatch\`), mode : \`${MODE:-non précisé}\`."
            fi
            echo
            echo "### Avant d'approuver"
            echo
            echo "- Ces migrations sont-elles passées par une PR relue et mergée ? Ce workflow"
            echo "  ne part que de \`main\`, mais il n'a aucun moyen de le vérifier lui-même."
            echo "- Le code qui dépend de ces colonnes est-il déjà déployé ? L'ordre attendu est"
            echo "  l'inverse (migration d'abord) — voir \`docs/DEPLOIEMENT_RELEASE_DB.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # N'écrire que ce qui est passé par une PR relue et mergée.
  #
  # `workflow_dispatch` accepte n'importe quelle ref, et un environnement GitHub
  # accepte TOUTES les branches par défaut. Sans ce garde, un dispatch depuis une
  # branche appliquerait à la production un SQL jamais relu — et l'approbateur ne
  # verrait pas la ref, que l'interface Actions ne met pas en avant. La doctrine
  # « migration committée → PR relue → merge sur `main` » était mécanique tant que
  # le build de `main` était le seul écrivain ; elle deviendrait déclarative au
  # moment précis où ce chemin devient unique.
  #
  # Le garde tient en DEUX jobs, et il faut les deux. Le `if:` ci-dessous empêche
  # d'écrire — porté par le job, il est évalué AVANT les règles de l'environnement,
  # donc il ne consomme aucune approbation. Mais un job non éligible est *skipped*
  # : rien n'est écrit, et rien n'est DIT. Le job `ref-refusee` porte la condition
  # inverse et échoue bruyamment, pour que « release refusée » ne se lise pas comme
  # « rien à faire ». Ailleurs dans ce fichier, « fail-closed » désigne un `exit 1`
  # nommé sur stderr : c'est ce que fait ce second job, et pas le premier seul.
  #
  # Troisième clé, côté plateforme : la restriction de branche de l'environnement
  # (runbook, étape ops). Elle survit à une réécriture de ce fichier, là où les
  # deux jobs se relisent en PR.
  release:
    runs-on: ubuntu-latest
    needs: resume
    if: github.ref == 'refs/heads/main'
    # L'environnement protégé porte les required reviewers et les secrets de prod.
    environment: release-db
    defaults:
      run:
        working-directory: web
    env:
      # URL directe (session mode, port 5432) : `migrate deploy` ne supporte pas
      # le pooler transaction. Secret d'environnement `release-db`, jamais committé.
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: "Garde — MIGRATE_DATABASE_URL requise (fail-closed)"
        run: |
          if [ -z "${MIGRATE_DATABASE_URL:-}" ]; then
            echo "❌ MIGRATE_DATABASE_URL absente du secret d'environnement 'release-db'." >&2
            echo "   Release refusée : aucune écriture ne doit partir sans cible explicite." >&2
            exit 1
          fi

      # `nabm_base` est un input libre : il passe par `env:` et n'est JAMAIS
      # interpolé (`${{ }}`) dans un bloc `run:`. GitHub substitue `${{ }}`
      # textuellement AVANT le shell — une valeur piégée s'exécuterait comme du
      # code, avec les secrets de l'environnement `release-db` en portée. Via
      # une variable shell (`"$NABM_BASE"`), le runner ne la ré-interprète pas.
      - name: "Garde — nabm_base requis pour import-cb"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'import-cb' }}
        env:
          NABM_BASE: ${{ inputs.nabm_base }}
        run: |
          if [ -z "$NABM_BASE" ]; then
            echo "❌ Mode import-cb sans 'nabm_base' : il faut NOMMER l'hôte visé." >&2
            echo "   Ce nom doit se retrouver dans MIGRATE_DATABASE_URL (garde --base)." >&2
            exit 1
          fi

      # Préflight lecture seule (BEGIN READ ONLY … ROLLBACK dans le fichier) :
      # n'écrit rien. Même contrôle que web/scripts/vercel-build.sh exécutait au
      # build avant `migrate deploy`.
      - name: "Préflight production (lecture seule)"
        run: |
          DATABASE_URL="$MIGRATE_DATABASE_URL" \
            npx prisma db execute --file prisma/checks/c5_ciqual_production_preflight.sql

      - name: "Migrations Prisma (migrate deploy)"
        run: DATABASE_URL="$MIGRATE_DATABASE_URL" npx prisma migrate deploy

      # ── Import NABM CB-02a ────────────────────────────────────────────────────
      # Désarmé hors du mode import-cb. Reprend la séquence que le build Vercel
      # exécutait : advisors → import (jeton/version/sha épinglés ci-dessous, hôte
      # nommé au déclenchement). PAS de contrat après l'import — il est rejoué
      # dans la transaction, voir le bloc en fin de job.
      #
      # Millésime et empreinte n'ont plus qu'UN lieu opérationnel depuis que le
      # build Vercel n'écrit plus : ici. Le jeton, lui, en a DEUX — le littéral
      # ci-dessous et la constante qui fait autorité, `NABM_IMPORT_CONFIRMATION`
      # dans web/prisma/nabmImport.ts. Un bump de millésime doit donc changer les
      # trois littéraux d'ici, cette constante, ET le secret
      # WN_CB_NABM_IMPORT_CONFIRMATION, ET rouvrir une PR relue. Oublier la
      # constante fait échouer l'import en « Confirmation CLI invalide » — fermé,
      # donc sans danger, mais autant le savoir avant de chercher.
      # Le modèle « deux clés qui bougent ensemble » : le jeton (épinglé + secret)
      # et l'hôte (input).
      # Une divergence échoue fermé (le garde --version/--sha256 de importNabm.ts
      # rejette), jamais un import silencieux d'un mauvais contenu.
      - name: "Advisors Supabase (fail-on warn, avant import)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'import-cb' }}
        run: |
          npx --yes supabase@2.109.1 db advisors \
            --db-url "$MIGRATE_DATABASE_URL" \
            --type all \
            --level warn \
            --fail-on warn \
            --output-format json

      - name: "Import NABM CB-02a (transactionnel, idempotent)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'import-cb' }}
        env:
          WN_CB_NABM_IMPORT_CONFIRMATION: ${{ secrets.WN_CB_NABM_IMPORT_CONFIRMATION }}
          # Passé par env, jamais interpolé dans le `run:` (cf. garde ci-dessus).
          NABM_BASE: ${{ inputs.nabm_base }}
        run: |
          npm run cb:nabm:apply -- \
            --confirmation "CB-02A-IMPORT-NABM-V105-MC-2026-07-26-v1" \
            --base "$NABM_BASE" \
            --version "V105" \
            --sha256 "3a9c289f081d293e7655de709a295bc6da9ece3f2301b86f1ea9625d1c7aed0f"

      # PAS de contrat post-import ici. Le contrat STRUCTUREL est désormais rejoué
      # DANS la transaction de l'import (prisma/importNabm.ts, fichier
      # cb_biologie_structure_v1.sql) : une violation annule l'import — plus de
      # fenêtre « rouge mais données écrites ». Les invariants de DONNÉES de
      # l'import sont vérifiés par sa relecture in-transaction ; la barrière D-003
      # (plages/liens d'AUTRES lots) reste un contrat de catalogue, hors du chemin
      # d'import (voir prisma/checks/cb_biologie_catalogue_v1.sql, joué en CI sur
      # base éphémère — donc jamais contre les données de production).

  # Le pendant bruyant du `if:` porté par `release` : sans lui, un dispatch hors
  # `main` se terminerait en *skipped*, sans un mot, et se lirait comme « la base
  # était déjà à jour ». Pas d'`environment:` ici — aucun reviewer n'est sollicité
  # pour apprendre qu'on s'est trompé de branche.
  ref-refusee:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: "Garde — release refusée hors de main (fail-closed)"
        env:
          # Par env, jamais interpolé dans le `run:` — même idiome que NABM_BASE.
          REF: ${{ github.ref }}
        run: |
          echo "❌ release-db refuse la ref « $REF »." >&2
          echo "   La base de production ne s'écrit qu'avec du SQL relu en PR et" >&2
          echo "   mergé sur main. Relancer depuis main :" >&2
          echo "     gh workflow run release-db.yml --ref main -f mode=migrate-only" >&2
          exit 1
